spring.application.name=imobiFlow

# AWS S3 Configuration
aws.s3.bucket=fotos-imoveis-pierre
aws.s3.region=us-east-1
aws.s3.image-max-width=1920
aws.s3.compression-threshold-bytes=2097152
aws.s3.low-quality-factor=0.6

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

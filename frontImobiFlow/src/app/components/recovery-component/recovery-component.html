<div class="h-screen w-full flex items-center justify-center bg-bg p-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow border border-gray-300 p-8">
    <div class="flex justify-center mb-8">
      <app-logo-component/>
    </div>

    <h1 class="text-2xl font-bold text-center text-gray-900 mb-2">Esqueceu a senha?</h1>
    <p class="text-sm text-gray-500 text-center mb-6">
      Informe seu email para receber um link de redefinição de senha.
    </p>

    @if (success()) {
      <div class="text-sm text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-xl px-4 py-3 mb-4">
        Email enviado! Verifique sua caixa de entrada e clique no link para redefinir sua senha.
      </div>
    }

    @if (!success()) {
      <form (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
        <div class="flex flex-col gap-1">
          <label for="email" class="text-sm font-medium text-gray-700">Email</label>
          <input
            id="email"
            type="email"
            [(ngModel)]="email"
            name="email"
            required
            placeholder="seu@email.com"
            class="w-full px-4 py-3 rounded-xl border border-gray-300 bg-gray-50 text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition"
          />
        </div>

        @if (error()) {
          <div class="text-sm text-red-600 bg-red-50 border border-red-200 rounded-xl px-4 py-3">
            {{ error() }}
          </div>
        }

        <button
          type="submit"
          [disabled]="loading()"
          class="w-full py-3 rounded-xl bg-emerald-600 text-white font-semibold hover:bg-emerald-700 disabled:opacity-50 disabled:cursor-not-allowed transition cursor-pointer"
        >
          {{ loading() ? 'Enviando...' : 'Enviar link de redefinição' }}
        </button>
      </form>
    }

    <div class="text-center mt-6">
      <a routerLink="/login" class="text-sm text-emerald-600 hover:text-emerald-700 hover:underline">
        Voltar para o login
      </a>
    </div>
  </div>
</div>
